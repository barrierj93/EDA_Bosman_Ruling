<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050606">
  <meta name="description" content="Explore how the balance of FIFA world champions shifted between South America and Europe from 1930 to 2026.">
  <title>Bosman Ruling — A Century of Champions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600&family=Barlow+Condensed:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --sa:#34dd62;
      --eu:#f0442d;
      --ink:#f5f5f2;
      --muted:rgba(245,245,242,.58);
      --faint:rgba(245,245,242,.14);
      --panel:rgba(8,9,9,.68);
      --year-progress:0%;
      --year-track-trim:0px;
    }
    *{box-sizing:border-box}
    html{background:#050606;scroll-behavior:auto}
    body{margin:0;background:#050606;color:var(--ink);font-family:"Albert Sans",sans-serif;overflow-x:hidden}
    button{font:inherit}
    .scroll-space{height:11500px;position:relative}
    .scene{position:sticky;top:0;width:100%;height:100svh;min-height:600px;overflow:hidden;background:#050606;isolation:isolate}
    .backdrop{position:absolute;inset:0;background:url("./img/backg.png") center/cover no-repeat;filter:saturate(.78) contrast(1.08) brightness(.9)}
    .backdrop::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.76) 0%,rgba(0,0,0,.57) 27%,rgba(0,0,0,.45) 58%,rgba(0,0,0,.7) 100%),linear-gradient(180deg,rgba(0,0,0,.3),rgba(0,0,0,.08) 45%,rgba(0,0,0,.72));}
    .backdrop::after{content:"";position:absolute;inset:0;opacity:.11;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.86' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E");mix-blend-mode:soft-light}
    .vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 130px 38px rgba(0,0,0,.78);z-index:2}

    .topbar{position:absolute;z-index:20;top:0;left:0;right:0;height:88px;margin:0 clamp(24px,3.4vw,66px);display:grid;grid-template-columns:minmax(310px,1fr) auto;align-items:center;gap:28px}
    .title{display:flex;align-items:center;gap:22px;margin:0;white-space:nowrap}
    .brand-name{font:800 18px/.78 "Barlow Condensed",sans-serif;letter-spacing:-.025em;text-transform:uppercase}
    .brand-separator{width:1px;height:34px;background:rgba(255,255,255,.55)}
    .brand-description{font:500 10px/1.7 "Albert Sans",sans-serif;letter-spacing:.39em;text-transform:uppercase;color:rgba(255,255,255,.72)}
    .filters{display:flex;gap:5px}
    .filter{height:31px;padding:0 15px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.12);color:rgba(255,255,255,.42);font:700 12px/1 "Barlow Condensed",sans-serif;letter-spacing:.13em;text-transform:uppercase;cursor:pointer;transition:.2s ease}
    .filter:hover{border-color:rgba(255,255,255,.4);color:#fff}
    .filter.is-active{border-color:rgba(255,255,255,.72);background:rgba(255,255,255,.08);color:#fff}

    .intro{position:absolute;z-index:10;left:clamp(32px,5vw,96px);top:50%;width:min(430px,31vw);transform:translateY(-45%);transition:opacity .5s ease,transform .5s ease;pointer-events:none}
    .intro.is-hidden{opacity:0;transform:translateY(-52%)}
    .intro-index{display:flex;align-items:center;gap:15px;width:100%;margin-bottom:18px;color:rgba(255,255,255,.8);font:600 11px/1 "Albert Sans",sans-serif;letter-spacing:.18em}
    .intro-index i{display:block;width:110px;height:1px;background:linear-gradient(90deg,#fff,rgba(255,255,255,.2))}
    .intro h2{margin:0 0 22px;font:800 clamp(62px,6vw,116px)/.83 "Barlow Condensed",sans-serif;letter-spacing:-.035em;text-transform:uppercase}
    .intro p{width:min(420px,100%);margin:0;padding-top:20px;border-top:1px solid rgba(255,255,255,.28);color:rgba(255,255,255,.75);font-size:16px;line-height:1.55}
    .scroll-cue{display:flex;align-items:center;gap:13px;margin-top:34px;color:rgba(255,255,255,.7);font:600 11px/1.45 "Albert Sans",sans-serif;letter-spacing:.24em;text-transform:uppercase}
    .mouse{position:relative;width:22px;height:36px;border:1px solid rgba(255,255,255,.8);border-radius:13px;flex:none}
    .mouse::after{content:"";position:absolute;left:50%;top:8px;width:2px;height:7px;background:#fff;transform:translateX(-50%);animation:wheel 1.5s infinite}
    @keyframes wheel{0%{opacity:0;transform:translate(-50%,0)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,9px)}}

    .story{position:absolute;z-index:12;left:clamp(30px,4.2vw,82px);top:118px;bottom:54px;width:clamp(280px,25vw,430px);display:flex;flex-direction:column;justify-content:flex-start;opacity:0;transform:translateX(-16px);transition:opacity .42s ease,transform .42s ease;pointer-events:none}
    .story.is-visible{opacity:1;transform:none;pointer-events:auto}
    .chapter-title{max-width:390px;margin:0;font:800 clamp(40px,4.1vw,76px)/.92 "Barlow Condensed",sans-serif;letter-spacing:-.025em;text-transform:uppercase}
    .chapter-copy{max-width:390px;margin:20px 0 0;color:rgba(255,255,255,.72);font-size:15px;line-height:1.55}
    .story-scoreboard{width:100%;height:82px;margin-top:27px;padding-top:15px;border-top:1px solid rgba(255,255,255,.18);grid-template-columns:minmax(0,1fr) 1px minmax(0,1fr);gap:16px}
    .story-scoreboard .score{width:100%;min-width:0;grid-template-columns:44px minmax(0,1fr);gap:10px}
    .story-scoreboard .score:last-child{grid-template-columns:44px minmax(0,1fr)}
    .story-scoreboard .score-copy{min-width:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;text-align:left}
    .story-scoreboard .score-value{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
    .story-scoreboard .score img{width:44px;height:44px}
    .story-scoreboard .score .continent{white-space:nowrap}
    .story-scoreboard .score strong{font-size:36px}
    .story-scoreboard .score small{margin-left:0}
    .story-scoreboard .score-divider{height:48px}

    .stage{position:absolute;z-index:8;left:30%;right:10%;top:92px;bottom:38px;display:flex;flex-direction:column;align-items:center;transition:opacity .45s ease,transform .45s ease}
    .stage.is-intro-hidden{opacity:0!important;transform:translateY(14px);pointer-events:none}
    .current{position:relative;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
    .active-year{font:600 clamp(18px,1.5vw,28px)/1 "Albert Sans",sans-serif;letter-spacing:.18em;color:rgba(255,255,255,.78)}
    .current-winners{display:flex;align-items:flex-end;justify-content:center;gap:clamp(28px,3.5vw,68px);min-height:112px;margin-top:8px}
    .current-winner{display:flex;min-width:118px;flex-direction:column;align-items:center;justify-content:flex-end}
    .current-winner-crest{width:clamp(54px,4vw,76px);height:clamp(54px,4vw,76px);object-fit:contain;filter:drop-shadow(0 5px 14px rgba(0,0,0,.7));margin-bottom:8px}
    .current-winner-name{font:700 clamp(17px,1.45vw,25px)/1 "Barlow Condensed",sans-serif;letter-spacing:.04em;text-transform:uppercase;text-shadow:0 2px 10px #000}
    .current-empty{max-width:640px;font:800 clamp(40px,3.7vw,68px)/.9 "Barlow Condensed",sans-serif;letter-spacing:.01em;text-transform:uppercase}
    .stage-current{width:100%;min-height:230px;flex:none;align-items:center;text-align:center;transition:opacity .28s ease}
    .stage-current.is-empty{visibility:hidden;opacity:0}
    .stage-current .current-winners{min-height:198px;margin-top:0;gap:42px}
    .stage-current .current-winner{min-width:180px;align-items:center}
    .stage-current .current-winner-crest{width:180px;height:180px;margin-bottom:8px}
    .stage-current .current-winner-name{font-size:20px}
    .stage-current .active-year{margin-top:10px;font-size:15px}

    .scoreboard{height:92px;display:grid;grid-template-columns:1fr 1px 1fr;align-items:center;gap:31px}
    .score-divider{height:65px;background:rgba(255,255,255,.35)}
    .score{display:grid;grid-template-columns:50px auto;align-items:center;gap:12px;min-width:170px}
    .score:last-child{grid-template-columns:auto 50px;text-align:right}
    .score img{width:50px;height:50px;object-fit:contain}
    .score .continent{display:block;margin-bottom:1px;color:var(--score-color);font:600 12px/1 "Albert Sans",sans-serif;letter-spacing:.14em;text-transform:uppercase}
    .score strong{display:inline-block;color:var(--score-color);font:700 42px/.95 "Albert Sans",sans-serif;min-width:2ch}
    .score small{margin-left:6px;color:rgba(255,255,255,.4);font:500 10px/1 "Albert Sans",sans-serif;letter-spacing:.16em;text-transform:uppercase}

    .bubble-field{position:relative;width:100%;flex:1;min-height:260px;margin-top:4px}
    .bubble{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid color-mix(in srgb,var(--bubble-color) 78%,white 22%);border-radius:50%;background:radial-gradient(circle at 38% 28%,color-mix(in srgb,var(--bubble-color) 25%,transparent),rgba(5,7,6,.78) 65%);box-shadow:inset 0 0 28px rgba(0,0,0,.38),0 0 16px color-mix(in srgb,var(--bubble-color) 18%,transparent);color:#fff;transform:translate(-50%,-50%) scale(1);transition:left .55s cubic-bezier(.2,.7,.2,1),top .55s cubic-bezier(.2,.7,.2,1),width .42s ease,height .42s ease,opacity .35s ease,transform .35s ease,filter .35s ease;overflow:hidden;text-align:center;padding:5px;will-change:left,top,width,height}
    .bubble.is-active{z-index:6;border-width:2px;box-shadow:0 0 10px var(--bubble-color),0 0 34px color-mix(in srgb,var(--bubble-color) 55%,transparent),inset 0 0 30px color-mix(in srgb,var(--bubble-color) 15%,black);transform:translate(-50%,-50%) scale(1.08)}
    .bubble-crest{position:absolute;z-index:0;left:20%;top:20%;width:60%;height:60%;object-fit:contain;object-position:center;opacity:.11;filter:saturate(.72) contrast(1.08);pointer-events:none;transition:opacity .3s ease,transform .3s ease}
    .bubble.is-active .bubble-crest{opacity:.17;transform:scale(1.04)}
    .bubble-name{position:relative;z-index:1;max-width:88%;font:600 clamp(8px,.72vw,13px)/1.05 "Albert Sans",sans-serif;white-space:normal;text-shadow:0 1px 4px #000,0 0 10px rgba(0,0,0,.92)}
    .bubble-count{position:relative;z-index:1;margin-top:5px;color:var(--bubble-color);font:700 clamp(10px,.9vw,17px)/1 "Albert Sans",sans-serif;text-shadow:0 1px 4px #000,0 0 10px #000}
    .bubble-count::after{content:" ×";font-size:.68em}

    .timeline{position:absolute;z-index:15;top:102px;right:0;bottom:48px;width:132px}
    .timeline-track{position:absolute;left:23px;top:8px;bottom:26px;width:1px;background:rgba(255,255,255,.42)}
    .timeline-fill{position:absolute;left:22px;top:8px;width:3px;height:calc(var(--year-progress) - var(--year-track-trim));max-height:calc(100% - 34px);background:linear-gradient(var(--sa),#fff 68%,var(--eu));box-shadow:0 0 14px rgba(255,255,255,.22)}
    .timeline-dots{position:absolute;inset:8px auto 26px 18px;width:11px}
    .timeline-dot{position:absolute;left:1px;width:7px;height:7px;border-radius:50%;background:var(--dot);transform:translateY(-50%);opacity:.44;transition:opacity .25s,transform .25s,box-shadow .25s}
    .timeline-dot.is-past{opacity:.9}.timeline-dot.is-now{opacity:1;transform:translateY(-50%) scale(1.7);box-shadow:0 0 10px var(--dot)}
    .timeline-milestone{position:absolute;z-index:3;left:-3px;width:15px;height:15px;border:1px solid rgba(255,255,255,.9);border-radius:50%;background:#090a0a;box-shadow:0 0 0 3px rgba(255,255,255,.06),0 0 13px rgba(255,255,255,.28);transform:translateY(-50%);transition:.25s ease}
    .timeline-milestone::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--milestone-color,#fff)}
    .timeline-milestone.is-past{opacity:.72}.timeline-milestone.is-now{transform:translateY(-50%) scale(1.32);box-shadow:0 0 0 4px rgba(255,255,255,.09),0 0 18px var(--milestone-color,#fff)}
    .timeline-marker{position:absolute;z-index:5;left:10px;top:calc(8px + var(--year-progress) - var(--year-track-trim));display:flex;align-items:center;gap:10px;transform:translateY(-50%);transition:top .12s linear}
    .marker-ring{width:28px;height:28px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;background:rgba(4,5,5,.88);box-shadow:0 0 18px rgba(255,255,255,.18)}
    .marker-ring::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--active-color,#fff);box-shadow:0 0 10px var(--active-color,#fff)}
    .marker-year{position:absolute;right:40px;font:700 clamp(31px,3vw,55px)/1 "Barlow Condensed",sans-serif;white-space:nowrap;text-align:right;text-shadow:0 2px 10px #000}
    .ticks{position:absolute;left:50px;top:8px;bottom:26px;right:0;pointer-events:none}
    .tick{position:absolute;left:0;transform:translateY(-50%);display:flex;align-items:center;gap:9px;color:rgba(255,255,255,.46);font:400 13px/1 "Albert Sans",sans-serif}
    .tick::before{content:"";width:8px;height:1px;background:rgba(255,255,255,.5)}
    .tick.is-key{color:rgba(255,255,255,.86);font-weight:600}

    .special{position:absolute;z-index:18;left:0;right:0;top:104px;bottom:45px;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transform:scale(.96);transition:opacity .45s ease,transform .45s ease}
    .special.is-visible{opacity:1;transform:none}
    .milestone-panel{width:min(680px,94%);padding:28px 34px;border-top:1px solid rgba(255,255,255,.28);border-bottom:1px solid rgba(255,255,255,.28);background:linear-gradient(90deg,transparent,rgba(0,0,0,.68) 18%,rgba(0,0,0,.68) 82%,transparent);text-align:center}
    .milestone-panel .year{color:var(--milestone-color,#fff);font:600 18px/1 "Albert Sans",sans-serif;letter-spacing:.14em}
    .milestone-panel h3{margin:9px auto 3px;max-width:660px;font:800 clamp(50px,5vw,90px)/.88 "Barlow Condensed",sans-serif;letter-spacing:.025em;text-transform:uppercase}
    .milestone-panel h3.is-long{font-size:clamp(38px,4vw,68px)}
    .milestone-panel .sub{font:400 25px/1 "Albert Sans",sans-serif;letter-spacing:.12em;text-transform:uppercase}
    .gavel{width:70px;height:70px;margin:22px auto;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.5)}
    .gavel img{width:43px;height:43px;object-fit:contain}
    .pre-score{display:flex;justify-content:center;align-items:center;gap:42px}
    .pre-score span{display:flex;align-items:center;gap:11px;color:var(--c);font:700 43px/1 "Albert Sans",sans-serif}
    .pre-score img{width:46px;height:46px;object-fit:contain}
    .pre-score i{height:50px;width:1px;background:rgba(255,255,255,.3)}
    .milestone-panel p{margin:22px auto 0;max-width:520px;color:rgba(255,255,255,.67);font-size:14px;line-height:1.5}


    @media (max-width:1100px){
      .topbar{grid-template-columns:1fr auto}.stage{left:31%;right:10%}.story{width:27vw}.chapter-copy{font-size:14px}.bubble-name{font-size:9px}
    }
    @media (min-width:761px) and (max-height:850px){
      .stage{top:48px;bottom:22px;left:29%;right:8%}
      .stage-current{min-height:208px}
      .stage-current .current-winners{min-height:174px}
      .stage-current .current-winner{min-width:164px}
      .stage-current .current-winner-crest{width:164px;height:164px;margin-bottom:6px}
      .stage-current .current-winner-name{font-size:18px}
      .stage-current .active-year{margin-top:7px;font-size:14px}
      .bubble-field{margin-top:0;min-height:300px}
    }
    @media (max-width:760px),(max-aspect-ratio:3/4){
      .scroll-space{height:9800px}.scene{min-height:540px}
      .backdrop{background-image:url("./img/backg-mobile.png");background-position:center}.vignette{box-shadow:inset 0 0 72px 20px rgba(0,0,0,.82)}
      .topbar{height:108px;margin:0 14px;grid-template-columns:1fr;align-content:center;gap:10px}.title{gap:12px;white-space:nowrap;max-width:310px}.brand-name{font-size:14px}.brand-separator{height:27px}.brand-description{font-size:7px;line-height:1.65;letter-spacing:.28em}.filters{position:absolute;top:70px;left:0}.filter{height:26px;padding:0 8px;font-size:9px}
      .intro{left:20px;right:20px;top:47%;width:auto}.intro h2{font-size:clamp(59px,20vw,82px)}.intro p{font-size:14px;line-height:1.5}.scroll-cue{margin-top:25px}
      .story{left:14px;right:55px;top:121px;bottom:12px;width:auto;justify-content:flex-start}.story-copy-wrap{max-width:none}.chapter-title{max-width:100%;font-size:clamp(34px,10.8vw,41px);line-height:.87}.chapter-copy{max-width:100%;font-size:11px;line-height:1.38;margin-top:9px}.story-scoreboard{height:48px;margin-top:9px;padding-top:7px;gap:8px}.story-scoreboard .score{min-width:104px;grid-template-columns:25px auto;gap:5px}.story-scoreboard .score:last-child{grid-template-columns:25px auto}.story-scoreboard .score img{width:25px;height:25px}.story-scoreboard .score strong{font-size:24px}.story-scoreboard .score-divider{height:31px}
      .story.is-visible~.stage{top:clamp(340px,41svh,385px)}
      .stage{left:8px;right:48px;top:clamp(300px,36svh,340px);bottom:54px}.active-year{font-size:11px}.current-winners{gap:22px;min-height:54px;margin-top:5px}.current-winner{min-width:74px}.current-winner-crest{width:34px;height:34px;margin-bottom:4px}.current-winner-name{max-width:90px;font-size:12px}.current-empty{max-width:270px;font-size:29px;line-height:.9}.stage-current{min-height:124px}.stage-current .current-winners{min-height:98px;margin-top:0;gap:20px}.stage-current .current-winner{min-width:92px}.stage-current .current-winner-crest{width:88px;height:88px;margin-bottom:4px}.stage-current .current-winner-name{font-size:12px}.stage-current .active-year{margin-top:5px;font-size:10px}
      .scoreboard{height:57px;gap:9px}.score{grid-template-columns:27px auto;min-width:105px;gap:6px}.score:last-child{grid-template-columns:auto 27px}.score img{width:27px;height:27px}.score .continent{font-size:7px;letter-spacing:.1em}.score strong{font-size:26px}.score small{font-size:6px;margin-left:2px}.score-divider{height:37px}
      .bubble-field{min-height:110px;margin-top:0}.bubble-crest{opacity:.09}.bubble.is-active .bubble-crest{opacity:.14}.bubble-name{font-size:6.5px}.bubble-count{font-size:8px;margin-top:2px}
      .timeline{top:118px;right:4px;bottom:21px;width:52px}.timeline-track{left:12px}.timeline-fill{left:11px}.timeline-dots{left:8px}.timeline-marker{left:-1px;gap:5px}.marker-ring{width:27px;height:27px}.marker-year{right:34px;top:2px;font-size:22px}.ticks{display:none}
      .special{left:0;right:0;top:150px;bottom:70px}.milestone-panel{width:min(680px,calc(100% - 28px));padding:20px 8px}.milestone-panel h3{font-size:52px}.milestone-panel h3.is-long{font-size:36px}.milestone-panel .sub{font-size:16px}.gavel{width:58px;height:58px;margin:16px auto}.gavel img{width:34px;height:34px}.pre-score{gap:18px}.pre-score span{font-size:31px;gap:6px}.pre-score img{width:33px;height:33px}.milestone-panel p{font-size:11px;margin-top:15px}
      .story-scoreboard{height:59px;margin-top:20px;padding-top:12px}
      .story.is-visible~.stage{top:clamp(405px,49svh,455px)}
      .stage-current{padding-top:8px}
    }
    @media (max-width:360px){
      .title{max-width:285px}.brand-name{font-size:13px}.brand-description{font-size:6.5px;letter-spacing:.22em}.filter{padding:0 6px;font-size:8px}
      .story{right:49px}.chapter-title{font-size:34px}.chapter-copy{font-size:10px}
      .stage{right:44px;top:clamp(292px,35svh,326px)}
    }
    @media (max-width:760px) and (max-height:680px){
      .story{top:113px;bottom:8px}.chapter-title{font-size:30px}.chapter-copy{font-size:9px;line-height:1.3;margin-top:7px}.story-scoreboard{height:40px;margin-top:4px;padding-top:4px}.story-scoreboard .score strong{font-size:21px}
      .stage{top:258px;bottom:42px}.story.is-visible~.stage{top:305px}.scoreboard{height:47px}.stage-current{min-height:105px}.stage-current .current-winners{min-height:82px}.stage-current .current-winner-crest{width:72px;height:72px}.bubble-field{min-height:75px}
      .story-scoreboard{height:50px;margin-top:12px;padding-top:8px}

    }
    @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="scroll-space" id="scrollSpace">
    <main class="scene" aria-label="FIFA champions historical scrollytelling">

    function slugify(value){
